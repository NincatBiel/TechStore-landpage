<head>

    <meta name="author" content="Gabriel Ramos">
    <link rel="stylesheet" href="styles.css">
    <title>TechStore | Produtos de qualidade</title>
</head>
<body>

        <h1 class="logo">TechStore</h1>
        <nav>
           <a href="#produtos">Produtos</a>

        </nav>
    </header>
    
    <main>
        <h1>Nossos produtos</h1>

            <form id="form-inscricao">

        </section>
    </main>
    
    <footer>
